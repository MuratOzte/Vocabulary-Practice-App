name: AST fixture native validation
on:
  pull_request:
    paths: ['ast-stress/**', '.github/workflows/ast-fixtures.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, java, csharp, go, rust]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        if: matrix.language == 'java'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'csharp'
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: '1.23.x'
          cache: false
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.language == 'rust'
      - name: Validate head with native compiler
        env:
          GO111MODULE: 'off'
        run: python ast-stress/validate.py '${{ matrix.language }}' > head-validation.json
      - name: Validate frozen base with native compiler
        if: github.event_name == 'pull_request'
        env:
          GO111MODULE: 'off'
          AST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p /tmp/ast-frozen-base
          git archive "$AST_BASE_SHA" ast-stress | tar -x -C /tmp/ast-frozen-base
          python ast-stress/validate.py '${{ matrix.language }}' --root /tmp/ast-frozen-base/ast-stress > base-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.language }}
          path: '*-validation.json'
